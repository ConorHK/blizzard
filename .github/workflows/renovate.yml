name: renovate
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
jobs:
  renovate:
    runs-on: [self-hosted, nix, x86_64-linux]
    environment: production
    permissions:
      actions: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Sync repository
        uses: actions/checkout@v6
      - run: renovate --platform=github ConorHK/blizzard
        env:
          RENOVATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOG_LEVEL: debug
      # Its GITHUB_TOKEN pushes start no workflows.
      - name: Build renovate branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/branches" \
            --jq '.[] | select(.name | startswith("renovate/")) | "\(.name) \(.commit.sha)"' |
            while read -r branch sha; do
              runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml \
                --commit "$sha" --json databaseId --jq length)
              if [ "$runs" = 0 ]; then
                gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
              fi
            done
