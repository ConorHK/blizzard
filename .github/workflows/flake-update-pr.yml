name: flake-update-pr
on:
  workflow_run:
    workflows: ["build"]
    types: [completed]
    branches: ["auto-flake-bump"]
jobs:
  create-pr:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, nix, x86_64-linux]
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - name: Open PR
        run: |
          gh pr create \
            --title "chore: update flake inputs" \
            --body "Automated flake input updates via \`nix flake update\`. Check and build workflows passed." \
            --base main \
            --head "auto-flake-bump"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
