name: flake-update
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
jobs:
  update:
    runs-on: [self-hosted, nix, x86_64-linux]
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v6
      - name: Update flake inputs
        run: nix --extra-experimental-features "nix-command flakes" flake update
      - name: Run flake check
        run: nix --extra-experimental-features pipe-operators flake check .
      - name: Push branch if flake.lock changed
        run: |
          if git diff --quiet flake.lock; then
            echo "No changes to flake.lock"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "auto-flake-bump"
          git add flake.lock
          git commit -m "chore: update flake inputs"
          pr_number=$(gh pr list --head "auto-flake-bump" --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr_number" ]; then
            gh pr close "$pr_number"
          fi
          git push --force origin "auto-flake-bump"
          gh workflow run build.yml --ref "auto-flake-bump"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
