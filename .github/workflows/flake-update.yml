name: flake-update
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
jobs:
  update:
    runs-on: [self-hosted, nix, x86_64-linux]
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - name: Update flake inputs
        run: nix --extra-experimental-features "nix-command flakes" flake update

      - name: Push branch if flake.lock changed
        run: |
          if git diff --quiet flake.lock; then
            echo "No changes to flake.lock"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "flake-update/auto"
          git add flake.lock
          git commit -m "chore: update flake inputs"
          git push --force origin "flake-update/auto"
          gh workflow run build.yml --ref "flake-update/auto"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
