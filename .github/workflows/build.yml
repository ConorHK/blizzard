name: build
on:
  push:
  workflow_dispatch:
jobs:
  check:
    runs-on: [self-hosted, nix, x86_64-linux]
    environment: production
    steps:
      - name: Sync repository
        uses: actions/checkout@v6
      # devenv's dev shell is a checked output and needs to know the project
      # directory via the impure `devenv-root` input — mirror what .envrc does
      # so `nix flake check` can evaluate the shell in CI (no direnv here).
      - run: |
          mkdir -p "$PWD/.devenv"
          printf %s "$PWD" > "$PWD/.devenv/root"
          nix --extra-experimental-features pipe-operators flake check \
            --no-pure-eval \
            --override-input devenv-root "file+file://$PWD/.devenv/root" .
  discover:
    runs-on: [self-hosted, nix, x86_64-linux]
    environment: production
    outputs:
      machines: ${{ steps.list.outputs.machines }}
    steps:
      - name: Sync repository
        uses: actions/checkout@v6
      # Source of truth is the flake itself — adding/removing a host updates the
      # build matrix automatically. (All hosts are x86_64-linux, matching the runner.)
      - id: list
        run: |
          machines=$(nix --extra-experimental-features pipe-operators eval --json \
            .#nixosConfigurations --apply builtins.attrNames)
          echo "machines=$machines" >> "$GITHUB_OUTPUT"
  build-machines:
    needs: [check, discover]
    strategy:
      fail-fast: false
      matrix:
        machine: ${{ fromJSON(needs.discover.outputs.machines) }}
    runs-on: [self-hosted, nix, x86_64-linux]
    environment: production
    steps:
      - name: Sync repository
        uses: actions/checkout@v6
      - run: |
          export CACHIX_AUTH_TOKEN="$(cat /run/agenix/github-runner-cachix)"
          out=$(nix --extra-experimental-features pipe-operators build -L --print-out-paths \
            .#nixosConfigurations.${{ matrix.machine }}.config.system.build.toplevel)
          nix path-info -r "$out" | cachix push conorhk
  # Fast-forward `stable` to the commit that just built for every host.
  # system.autoUpgrade points at `stable`, so this is the deployment gate:
  # broken pushes to main never reach the machines.
  promote:
    needs: [build-machines]
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, nix, x86_64-linux]
    environment: production
    permissions:
      contents: write
    steps:
      - name: Sync repository
        uses: actions/checkout@v6
      - run: git push origin HEAD:stable
