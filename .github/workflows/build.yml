name: build
on:
  push:
  workflow_dispatch:
# One runner: newer pushes supersede queued runs.
# Main finishes its run so deployed advances.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  check:
    runs-on: [self-hosted, nix, x86_64-linux]
    timeout-minutes: 90
    environment: production
    steps:
      - name: Sync repository
        uses: actions/checkout@v6
      # Roots stop min-free GC eating fresh results.
      - name: Build checks
        run: |
          roots="$RUNNER_TEMP/checks"
          mkdir -p "$roots"
          # One eval per check; all at once peaks near 7G.
          checks=$(nix --extra-experimental-features pipe-operators eval --json .#checks.x86_64-linux \
            --apply builtins.attrNames | jq -r '.[]' | while read -r name; do
              nix --extra-experimental-features pipe-operators eval --json ".#checks.x86_64-linux.$name" \
                --apply 'check: {
                  vm = check ? driver;
                  drv = check.drvPath;
                  driver = check.driver.drvPath or null;
                }' | jq -c --arg name "$name" '. + { name: $name }'
            done | jq -s .)
          jq -r '.[] | select(.vm | not) | .drv + "^*"' <<<"$checks" |
            xargs -r nix build --out-link "$roots/check"
          jq -r '.[] | select(.vm) | .driver + "^*"' <<<"$checks" |
            xargs -r nix build --out-link "$roots/driver"
          # Parallel VMs under ci.slice miss boot timeouts.
          jq -r '.[] | select(.vm) | "\(.name) \(.drv)"' <<<"$checks" |
            while read -r name drv; do
              nix build -L --out-link "$roots/vm-$name" "$drv^*"
            done
      # Unchanged checks substitute after leprechaun's daily GC.
      - name: Cache check results
        if: ${{ !cancelled() }}
        run: |
          CACHIX_AUTH_TOKEN=$(cat /run/agenix/github-runner-cachix)
          export CACHIX_AUTH_TOKEN
          find "$RUNNER_TEMP/checks" -mindepth 1 -maxdepth 1 -exec readlink -f {} + |
            cachix push conorhk ||
            echo "::warning::cachix push of check results failed"
  discover:
    runs-on: [self-hosted, nix, x86_64-linux]
    timeout-minutes: 15
    environment: production
    outputs:
      machines: ${{ steps.list.outputs.machines }}
    steps:
      - name: Sync repository
        uses: actions/checkout@v6
      # Source of truth is the flake itself — adding/removing a host updates the
      # build matrix automatically. (All hosts are x86_64-linux, matching the runner.)
      - id: list
        run: |
          machines=$(nix --extra-experimental-features pipe-operators eval --json \
            .#nixosConfigurations --apply builtins.attrNames)
          echo "machines=$machines" >> "$GITHUB_OUTPUT"
  build-machines:
    needs: [check, discover]
    strategy:
      fail-fast: false
      matrix:
        machine: ${{ fromJSON(needs.discover.outputs.machines) }}
    runs-on: [self-hosted, nix, x86_64-linux]
    timeout-minutes: 180
    environment: production
    steps:
      - name: Sync repository
        uses: actions/checkout@v6
      - run: |
          export CACHIX_AUTH_TOKEN="$(cat /run/agenix/github-runner-cachix)"
          out=$(nix --extra-experimental-features pipe-operators build -L --print-out-paths \
            .#nixosConfigurations.${{ matrix.machine }}.config.system.build.toplevel)
          nix path-info -r "$out" | cachix push conorhk
  # Hosts auto-upgrade from this branch.
  promote:
    needs: [build-machines]
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, nix, x86_64-linux]
    timeout-minutes: 15
    environment: production
    permissions:
      contents: write
    steps:
      - name: Sync repository
        uses: actions/checkout@v6
        with:
          # Shallow history breaks the fast-forward check.
          fetch-depth: 0
      # Runs finish out of order; skip superseded ones.
      - run: |
          git fetch origin deployed
          if git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "deployed already contains $GITHUB_SHA"
            exit 0
          fi
          # No force, so a race cannot rewind.
          git push origin "$GITHUB_SHA:refs/heads/deployed"
