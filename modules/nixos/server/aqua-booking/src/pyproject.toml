[project]
name = "aqua-booking"
version = "0.1.0"
description = "Automated Nuffield Health Aqua Aerobics booking"
requires-python = ">=3.11"
dependencies = ["tzdata"]

[project.scripts]
aqua-booking = "aqua_booking.run:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["aqua_booking*"]
