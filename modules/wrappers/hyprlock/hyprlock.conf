background {
  color=rgb(1c1c1c)
}

general {
  disable_loading_bar=true
  hide_cursor=true
  no_fade_in=false
}

input-field {
  monitor=@monitor@
  size=600, 100
  check_color=rgb(af875f)
  fade_on_empty=false
  fail_color=rgb(af5f5f)
  fail_text=<i>$PAMFAIL ($ATTEMPTS)</i>
  font_color=rgb(dfdfaf)
  halign=center
  inner_color=rgb(1c1c1c)
  outer_color=rgb(878787)
  outline_thickness=4
  placeholder_text=Enter password
  position=0, 0
  valign=center
}
