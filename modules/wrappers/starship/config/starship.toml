format = "$directory$git_branch$git_commit$git_state$git_metrics$git_status$fill$status$cmd_duration$all$line_break$character"
palette = "base16"

[cmd_duration]
format = " [⏱ $duration]($style) "

[custom.jj]
command = "jj log -r @ --no-graph --color never -T 'separate(\" \", \"at\", change_id.shortest(4), if(empty, \"(empty)\"))'\n"
format = "[$output]($style) "
style = "purple"
when = "jj root"

[directory]
read_only = " 󰌾"

[fill]
style = "bright-black"
symbol = "·"

[git_branch]
format = "[$symbol](white)[$branch(:$remote_branch)]($style) "
symbol = "on "

[git_status]
ahead = "⇡$count"
behind = "⇣$count"
conflicted = "=$count"
deleted = "✖$count"
diverged = "⇡$ahead_count ⇣$behind_count"
format = "(([$conflicted](bright-red) )([$stashed](bright-green) )([$deleted](bright-red) )([$renamed](bright-yellow) )([$modified](bright-yellow) )([$staged](bright-yellow) )([$untracked](bright-blue) )[$ahead_behind](bright-green) )"
modified = "!$count"
renamed = "»$count"
staged = "+$count"
stashed = "*$count"
untracked = "?$count"

[hostname]
format = "[$ssh_symbol$hostname]($style) "
ssh_symbol = ""
style = "bold yellow"

[kubernetes]
disabled = false
format = "[$symbol$context(/$namespace)]($style) "

[nix_shell]
format = "[$symbol$name \\($state\\)]($style) "
symbol = " "

[nodejs]
disabled = true
format = "[$symbol($version )]($style) "

[palettes.base16]
base00 = "#1c1c1c"
base01 = "#262626"
base02 = "#626262"
base03 = "#878787"
base04 = "#dfdfaf"
base05 = "#dfdfaf"
base06 = "#dfdfaf"
base07 = "#dfdfaf"
base08 = "#af5f5f"
base09 = "#af875f"
base0a = "#af875f"
base0b = "#87875f"
base0c = "#87afaf"
base0d = "#878787"
base0e = "#af8787"
base0f = "#87afaf"
base10 = "#1c1c1c"
base11 = "#1c1c1c"
base12 = "#af5f5f"
base13 = "#af875f"
base14 = "#87875f"
base15 = "#87afaf"
base16 = "#878787"
base17 = "#af8787"
black = "#1c1c1c"
blue = "#878787"
bright-black = "#878787"
bright-blue = "#878787"
bright-cyan = "#87afaf"
bright-green = "#87875f"
bright-magenta = "#af8787"
bright-purple = "#af8787"
bright-red = "#af5f5f"
bright-white = "#dfdfaf"
bright-yellow = "#af875f"
brown = "#87afaf"
cyan = "#87afaf"
green = "#87875f"
magenta = "#af8787"
orange = "#af875f"
purple = "#af8787"
red = "#af5f5f"
white = "#dfdfaf"
yellow = "#af875f"

[python]
format = "[${symbol}${pyenv_prefix}(${version} )(($virtualenv) )]($style) "
symbol = " "

[status]
disabled = false
format = "[$symbol $status]($style) "
symbol = "✘"

[time]
disabled = false
format = "[$time]($style) "
style = "bright-black"

[username]
format = "[${user}]($style) "
