format = "$directory$custom$fill$status$cmd_duration$all$line_break$character"

[cmd_duration]
format = " [⏱ $duration]($style) "

[custom.jj]
command = """
jj log -r @ --no-graph --color never -T 'separate(" ", "at", change_id.shortest(4), if(empty, "(empty)"))'
"""
format = "[$output]($style) "
style = "purple"
when = "jj root"

[directory]
read_only = " 󰌾"

[fill]
style = "bright-black"
symbol = "·"

[git_branch]
disabled = true
format = "[$symbol](white)[$branch(:$remote_branch)]($style) "
symbol = "on "

[git_commit]
disabled = true

[git_metrics]
disabled = true

[git_state]
disabled = true

[git_status]
ahead = "⇡$count"
behind = "⇣$count"
conflicted = "=$count"
deleted = "✖$count"
disabled = true
diverged = "⇡$ahead_count ⇣$behind_count"
format = "(([$conflicted](bright-red) )([$stashed](bright-green) )([$deleted](bright-red) )([$renamed](bright-yellow) )([$modified](bright-yellow) )([$staged](bright-yellow) )([$untracked](bright-blue) )[$ahead_behind](bright-green) )"
modified = "!$count"
renamed = "»$count"
staged = "+$count"
stashed = "*$count"
untracked = "?$count"

[hostname]
format = "[$ssh_symbol$hostname]($style) "
ssh_symbol = ""
style = "bold yellow"

[kubernetes]
disabled = false
format = "[$symbol$context(/$namespace)]($style) "

[nix_shell]
format = '[$symbol$name \($state\)]($style) '
symbol = " "

[nodejs]
disabled = true
format = "[$symbol($version )]($style) "

[python]
format = "[${symbol}${pyenv_prefix}(${version} )(($virtualenv) )]($style) "
symbol = " "

[status]
disabled = false
format = "[$symbol $status]($style) "
symbol = "✘"

[time]
disabled = false
format = "[$time]($style) "
style = "bright-black"

[username]
format = "[${user}]($style) "
