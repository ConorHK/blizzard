# Clicked links only; kitty ships no file defaults here.

# Grep and build output carry a line fragment.
protocol file
mime text/*
fragment_matches ^\d+$
action launch --type=window --location=vsplit --cwd=current -- $EDITOR +$FRAGMENT -- $FILE_PATH

protocol file
mime text/*
action launch --type=window --location=vsplit --cwd=current -- $EDITOR -- $FILE_PATH

protocol file
mime inode/directory
action launch --type=tab --cwd -- $FILE_PATH
