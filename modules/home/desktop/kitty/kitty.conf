kitty_mod alt

# Bitmap font; see kitty.nix and gohu-otb.
font_family        family="GohuOTB"
bold_font          family="GohuOTB"
italic_font        family="GohuOTB"
bold_italic_font   family="GohuOTB"
font_size 10

# The 8x14 strike reports no line height.
modify_font cell_height 14px

# The post table puts underlines above baseline.
modify_font underline_position 3px

# Rendering is locked to one strike.
map kitty_mod+equal  no_op
map kitty_mod+plus   no_op
map kitty_mod+minus  no_op
map kitty_mod+kp_add no_op

# kitty_mod is alt, so these went missing.
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# auto splits the pane's longer side.
enabled_layouts splits:split_axis=auto,stack,tall,fat,grid,horizontal,vertical

background_opacity 1.0
window_padding_width 5
cursor_shape block
cursor_blink_interval 0

enable_audio_bell no
confirm_os_window_close 0

scrollback_lines 10000

# Zellij-style pane frames.
window_title_bar top
window_title_bar_min_windows 1
window_title_bar_align left
window_title_template " {fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.window}{progress_percent}{title}"

# Zellij habits. Splits neighbours are top/bottom, not up/down.
map alt+h neighboring_window left
map alt+j neighboring_window bottom
map alt+k neighboring_window top
map alt+l neighboring_window right

map alt+shift+h move_window left
map alt+shift+j move_window bottom
map alt+shift+k move_window top
map alt+shift+l move_window right

map alt+left  neighboring_window left
map alt+down  neighboring_window bottom
map alt+up    neighboring_window top
map alt+right neighboring_window right

map alt+shift+left  move_window left
map alt+shift+down  move_window bottom
map alt+shift+up    move_window top
map alt+shift+right move_window right

map ctrl+alt+h layout_action move_to_screen_edge left
map ctrl+alt+j layout_action move_to_screen_edge bottom
map ctrl+alt+k layout_action move_to_screen_edge top
map ctrl+alt+l layout_action move_to_screen_edge right

map ctrl+alt+left  layout_action move_to_screen_edge left
map ctrl+alt+down  layout_action move_to_screen_edge bottom
map ctrl+alt+up    layout_action move_to_screen_edge top
map ctrl+alt+right layout_action move_to_screen_edge right

# The first window gets a session too.
shell zmx-open

# Remote panes follow the ssh host into zmx.
map alt+enter      kitten remote-pane.py split
map ctrl+alt+enter kitten remote-pane.py hsplit

# Shift breaks out: a local pane from anywhere.
map alt+shift+enter kitten remote-pane.py local

# No springboard; pick a host, get a session.
map alt+shift+o kitten zmx-host.py

# Pick a family, drop its sessions.
map alt+shift+x kitten zmx-clean.py

# zmx keeps panes; kitty keeps layout.
map alt+s       kitten save-session.py
map alt+shift+s goto_session ~/.local/share/kitty/sessions

# Crash recovery; newest autosave first.
map ctrl+alt+s goto_session ~/.local/share/kitty/sessions/autosave

watcher session-autosave.py

map alt+f toggle_layout stack

# Both close the pane; q alone would sit next to close_tab.
# The kitten offers to kill the zmx sessions.
map alt+q       kitten zmx-close.py
map alt+w       kitten zmx-close.py
map alt+shift+q kitten zmx-close.py tab

# base16 untitled; was stylix, now hardcoded.
background            #1c1c1c
foreground            #dfdfaf
selection_background  #878787
selection_foreground  #dfdfaf

cursor                #dfdfaf
cursor_text_color     #1c1c1c

url_color             #dfdfaf

active_border_color   #878787
inactive_border_color #262626

wayland_titlebar_color #1c1c1c
macos_titlebar_color   #1c1c1c

active_tab_background   #1c1c1c
active_tab_foreground   #dfdfaf
inactive_tab_background #262626
inactive_tab_foreground #dfdfaf
tab_bar_background      #262626

window_title_bar_active_foreground   #dfdfaf
window_title_bar_active_background   #626262
window_title_bar_inactive_foreground #878787
window_title_bar_inactive_background #262626

color0  #1c1c1c
color1  #af5f5f
color2  #87875f
color3  #af875f
color4  #878787
color5  #af8787
color6  #87afaf
color7  #dfdfaf

color8  #626262
color9  #af5f5f
color10 #87875f
color11 #af875f
color12 #878787
color13 #af8787
color14 #87afaf
color15 #dfdfaf

color16 #af875f
color17 #87afaf
color18 #262626
color19 #626262
color20 #dfdfaf
color21 #dfdfaf

# kitty_mod is alt, so this overrides the default new_tab.
map alt+t       kitten remote-pane.py tab

# Renaming a tab labels its zmx sessions to match.
map alt+shift+t kitten zmx-rename.py
map alt+shift+r set_window_title

map alt+bracketleft  previous_tab
map alt+bracketright next_tab
