[project]
name = "claude-ci"
version = "0.1.0"
description = "Claude review, merge and fix for blizzard's bot PRs"
requires-python = ">=3.12"
dependencies = ["anthropic", "pydantic"]

[project.scripts]
claude-ci = "claude_ci.run:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["claude_ci*"]
